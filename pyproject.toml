[project]
name = "zeggs"
version = "1.1.0"
description = "ZeroEGGS: zero-shot example-based gesture generation from speech"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "omegaconf>=2.3",
    "rich>=13",
    "pyloudnorm>=0.1.1",
    "tensorboard>=2.15",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
zeggs-preprocess = "zeggs.data_pipeline:main"
zeggs-train = "zeggs.main:train_zeggs"
zeggs-generate = "zeggs.generate:main"
zeggs-fix-feet = "zeggs.postprocess:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["zeggs*"]
